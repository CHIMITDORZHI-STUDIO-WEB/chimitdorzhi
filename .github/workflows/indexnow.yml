name: IndexNow ping

# Пингуем Яндекс через IndexNow после того, как страница опубликовалась
# (workflow Pages "pages build and deployment" успешно завершился).
# ВАЖНО: триггер workflow_run на системный "pages build and deployment" не срабатывает
# (ограничение GitHub) — из-за этого пинги не уходили с мая 2026. Теперь пингуем
# по пушу собранного блога и раз в сутки для подстраховки.
on:
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - 'predlozheniya/**'
      - 'sitemap.xml'
  schedule:
    - cron: '30 6 * * *'   # ежедневно в 06:30 UTC (09:30 МСК), после zen-drip
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ping IndexNow (Yandex)
        run: node tools/indexnow-ping.js
